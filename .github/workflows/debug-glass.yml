name: Debug Glass Build

on:
  push:
    branches:
      - glass-moodlet
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "orangechat-glass-debug"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat.glass"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "debug"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:1",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat.glass.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "debug"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v               -keystore app/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-glass-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
